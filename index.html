<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>꾹 점프</title>
<script>
  // =====================================================================
  //  ★ 버전 숫자: 파일을 고쳐서 올릴 때마다 1씩 올려 주세요.
  //    이 숫자 하나로 모든 파일에 꼬리표가 붙어서, 폰이 옛 파일을 쓰지 않습니다.
  //    화면 왼쪽 아래 "판 ○" 숫자가 이것과 같으면 새 파일이 잘 온 것입니다.
  // =====================================================================
  var VERSION = 5;
  document.write('<link rel="stylesheet" href="style.css?v=' + VERSION + '">');
</script>
</head>
<body>

<!-- 게임 화면 칸 (여기를 누르면 게임 조작) -->
<div id="stage"><canvas id="c"></canvas></div>

<!-- 오른쪽 위 버튼 (누르면 설정만 바뀌고 점프는 안 됨) -->
<div id="ui">
  <button id="btnSkin" type="button" hidden>스킨</button> <!-- 첫 화면·게임 오버 화면에서만 보임 -->
  <button id="btnSound" type="button">소리 켜짐</button>
  <button id="btnVibe" type="button">진동 켜짐</button>
</div>

<!-- 스킨 창: "스킨" 버튼을 누르면 화면 가운데에 뜸. 열려 있는 동안 게임은 눌리지 않음 -->
<div id="skinModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="skinTitle">
    <button class="close" type="button" aria-label="닫기">✕</button>
    <div class="title" id="skinTitle">스킨</div>
    <div id="skins"></div> <!-- 스킨 네모들이 여기 들어감 (많아지면 다음 줄로) -->
  </div>
</div>

<!-- 왼쪽 아래 버전 표시 -->
<div id="ver"></div>

<!-- 폰을 가로로 눕혔을 때 안내 -->
<div id="rotate">세로로 돌려 주세요</div>

<script>
  document.getElementById('ver').textContent = '판 ' + VERSION;
  // 순서대로 불러오기: 조절판 → 소리 → 게임
  ['settings.js', 'sound.js', 'game.js'].forEach(function (f) {
    document.write('<script src="' + f + '?v=' + VERSION + '"><\/script>');
  });
</script>
</body>
</html>
