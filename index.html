<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>꾹 점프</title>
<script>
  // =====================================================================
  //  ★ 버전 숫자: 파일을 고쳐서 올릴 때마다 1씩 올려 주세요.
  //    이 숫자 하나로 모든 파일에 꼬리표가 붙어서, 폰이 옛 파일을 쓰지 않습니다.
  //    화면 왼쪽 아래 "판 ○" 숫자가 이것과 같으면 새 파일이 잘 온 것입니다.
  // =====================================================================
  var VERSION = 24;
  document.write('<link rel="stylesheet" href="style.css?v=' + VERSION + '">');
</script>
<!-- 글꼴: 영어·숫자 Quicksand (구글, 굵기 500·600·700만), 한글 Pretendard (무료, 쓰는 글자만 조금씩 받음). 못 불러와도 폰 기본 글꼴로 보임 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css">
</head>
<body>

<!-- 게임 화면 칸 (여기를 누르면 게임 조작) -->
<div id="stage"><canvas id="c"></canvas></div>

<!-- 가장자리를 살짝 뿌옇게 하는 얇은 막 (누르는 것은 그대로 아래 게임으로 감) -->
<div id="vignette"></div>

<!-- 오른쪽 위 버튼 (누르면 설정만 바뀌고 점프는 안 됨) -->
<div id="ui">
  <!-- 아이콘은 그림 파일이 아니라 코드(선과 도형)로 그림. 꺼지면 사선이 그어지고 흐려짐 -->
  <!-- 테마 버튼: 첫 화면·게임 오버 화면에서만 보임 (팔레트 아이콘) -->
  <button id="btnTheme" type="button" aria-label="테마" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="line" d="M12 3.5a8.5 8.5 0 1 0 0 17c1.1 0 1.7-.8 1.7-1.6 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.6 1.7-1.6h2c2.5 0 4.6-2 4.6-4.4C21 6.8 17 3.5 12 3.5z"/>
      <circle class="fill" cx="7.6" cy="11.2" r="1.25"/><circle class="fill" cx="10.2" cy="7.4" r="1.25"/><circle class="fill" cx="14.6" cy="7.6" r="1.25"/>
    </svg>
  </button>
  <button id="btnSound" type="button" aria-label="소리">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="fill" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>          <!-- 스피커 -->
      <path class="line wave" d="M15.5 9.2a4 4 0 0 1 0 5.6"/>            <!-- 소리 물결 -->
      <path class="line wave" d="M18 6.8a7.5 7.5 0 0 1 0 10.4"/>
      <path class="line slash" d="M4.5 4.5l15 15"/>                     <!-- 꺼짐 사선 -->
    </svg>
  </button>
  <button id="btnVibe" type="button" aria-label="진동">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect class="line" x="8.5" y="4.5" width="7" height="15" rx="2"/>  <!-- 폰 -->
      <path class="line wave" d="M5.5 9v6M3 10.5v3M18.5 9v6M21 10.5v3"/>  <!-- 진동 떨림 -->
      <path class="line slash" d="M4.5 4.5l15 15"/>
    </svg>
  </button>
</div>

<!-- 테마 선택 칸: 유리 느낌 창에 테마 카드가 나란히. 열려 있는 동안 게임은 눌리지 않음 -->
<div id="themeModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="themeTitle">
    <div class="head">
      <span class="stars" id="themeStars"></span>   <!-- 내 별가루 ✦ 숫자 -->
      <span class="title" id="themeTitle">테마</span>
      <button class="close" type="button" aria-label="닫기">✕</button>
    </div>
    <div id="themeList"></div>                      <!-- 테마 카드들 (settings.js에 테마를 넣으면 자동으로 늘어남) -->
  </div>
</div>

<!-- (꺼 둔 기능) 새 것 공개 화면: 얻은 게 있을 때만 게임 오버 뒤에 뜸. 지금은 쓰이지 않음 -->
<div id="reveal" hidden>
  <div class="card"> <!-- 반투명 흰 유리 창 -->
  <div class="title">새로 열렸어요!</div>
  <div class="box">
    <div class="glow"></div>     <!-- 공개할 때 퍼지는 빛 -->
    <div class="big"><b></b></div> <!-- 얻은 것 미리보기 네모 (처음엔 회색 실루엣), b = 빛줄기 -->
    <div class="flash"></div>    <!-- 탭했을 때 "번쩍" -->
  </div>
  <div class="name">&nbsp;</div>
  <div class="hint">탭해서 열기</div>
  <div class="actions" hidden>
    <button class="use" type="button">바로 쓰기</button>
    <button class="skip" type="button">닫기</button>
  </div>
  </div>
</div>

<!-- 왼쪽 아래 버전 표시 -->
<div id="ver"></div>

<!-- 폰을 가로로 눕혔을 때 안내 -->
<div id="rotate">세로로 돌려 주세요</div>

<script>
  document.getElementById('ver').textContent = '판 ' + VERSION;
  // 순서대로 불러오기: 조절판 → 소리 → 게임
  ['settings.js', 'sound.js', 'game.js'].forEach(function (f) {
    document.write('<script src="' + f + '?v=' + VERSION + '"><\/script>');
  });
</script>
</body>
</html>
