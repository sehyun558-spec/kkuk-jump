<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>꾹 점프</title>
<style>
/*
VOICE: 조용하고 미니멀, 손맛은 강하게
IDEA: 흰 종이 위 검은 기둥, 빨간 네모 하나
PICTURE: 게임 화면 자체가 전부
COLOUR and TYPE: 미색 배경, 먹색 기둥, 코랄 포인트 / 시스템 고딕 굵게
LAYOUT: 전체 화면 캔버스, 점수는 위 가운데
*/
html,body{margin:0;height:100%;overflow:hidden;background:#f6f5f2;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
{
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = '-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';

// ---------- 색상 (밝은/어두운 테마) ----------
let C;
function pickColors(){
  const t = document.documentElement.dataset.theme;
  const dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  C = dark
    ? {bg:'#141416', ink:'#ececea', sub:'#7c7c82', accent:'#ff6a5c', veil:'rgba(20,20,22,.88)'}
    : {bg:'#f6f5f2', ink:'#1d1d1f', sub:'#9a9a9f', accent:'#ff5a4e', veil:'rgba(246,245,242,.9)'};
  document.body.style.background = C.bg;
}
pickColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', pickColors);
new MutationObserver(pickColors).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

// ---------- 화면 크기 ----------
let W, H, S, GY;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.min(W, H * 0.62, 520);   // 게임 기준 크기
  GY = H * 0.64;                     // 기둥 윗면 높이
}
addEventListener('resize', resize); resize();

// ---------- 저장 / 소리 / 진동 ----------
function load(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function save(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
let best = +(load('kkuk_best') || 0);

let ac = null;
function tone(f, d = .12, type = 'sine', vol = .12){
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + d + .02);
  } catch(e){}
}
const SCALE = [0, 2, 4, 7, 9];
function note(n){ // 콤보가 오를수록 음이 올라감
  const i = Math.min(n - 1, 14);
  return 523 * Math.pow(2, (SCALE[i % 5] + 12 * Math.floor(i / 5)) / 12);
}
function buzz(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }

// ---------- 게임 상태 ----------
let state, pillars, cur, player, camX, camTarget, score, combo, charge, jump,
    shake = 0, parts = [], pops = [], rings = [], overAt = 0, fallAt = 0, newBest = false, plays = 0;
const MAXC = () => S * 1.15;
const PS = () => S * 0.07;          // 플레이어 크기
const PZ = () => S * 0.038;         // 퍼펙트 구역 너비

function newPillar(prevRight){
  const lv = Math.min(score / 45, 1);
  const w = Math.max(S * (0.27 - 0.15 * lv) * (0.7 + Math.random() * 0.6), S * 0.075);
  const gap = S * (0.1 + Math.random() * (0.3 + 0.14 * lv));
  return {x: prevRight + gap, w};
}
function reset(){
  score = 0; combo = 0; cur = 0; charge = 0; newBest = false;
  parts = []; pops = []; rings = [];
  pillars = [{x: 0, w: S * 0.3}];
  for (let i = 0; i < 5; i++){ const l = pillars[pillars.length - 1]; pillars.push(newPillar(l.x + l.w)); }
  player = {x: pillars[0].w / 2, y: 0, vy: 0, sq: 1, rot: 0, dir: 1};
  camX = camTarget = player.x - W * 0.28;
  state = plays === 0 ? 'ready' : 'idle';
}
reset();

// ---------- 효과 ----------
function burst(x, y, col, n){
  for (let i = 0; i < n; i++){
    const a = -Math.PI * Math.random(), v = S * (0.4 + Math.random() * 1.1);
    parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: S * (0.008 + Math.random() * 0.012), life: 1, col});
  }
}
function pop(text, x, y, col, big){ pops.push({text, x, y, col, big, life: 1}); }

// ---------- 입력 ----------
function press(){
  tone(1, .01, 'sine', .0001); // 폰에서 소리 켜기용
  if (state === 'ready' || state === 'idle'){ state = 'charge'; charge = 0; }
  else if (state === 'over' && performance.now() - overAt > 450){ reset(); }
}
function release(){
  if (state !== 'charge') return;
  const d = charge;
  jump = {x0: player.x, d, t: 0, T: 0.36 + Math.min(d / S, 1.1) * 0.2, h: S * 0.1 + d * 0.32};
  state = 'fly'; plays++;
  tone(420 + d / S * 260, .07, 'triangle', .06);
}
addEventListener('pointerdown', e => { e.preventDefault(); press(); });
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('touchstart', e => e.preventDefault(), {passive: false});
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat){ e.preventDefault(); press(); } });
addEventListener('keyup', e => { if (e.code === 'Space') release(); });

// ---------- 착지 판정 ----------
function land(){
  const c = pillars[cur], n = pillars[cur + 1], px = player.x;
  if (px >= c.x && px <= c.x + c.w){ state = 'idle'; player.sq = .8; tone(260, .05, 'sine', .05); return; }

  if (px >= n.x && px <= n.x + n.w){
    const center = n.x + n.w / 2, dist = Math.abs(px - center);
    const edge = Math.min(px - n.x, n.x + n.w - px);
    let gain = 1;
    if (dist <= PZ() / 2 + S * 0.006){
      combo++; gain = 1 + Math.min(combo, 9);
      player.x = center;
      burst(center, GY, C.accent, 12 + combo * 3);
      rings.push({x: center, r: PS() * .6, life: 1});
      shake = 3 + Math.min(combo, 7);
      buzz(18);
      tone(note(combo), .2, 'triangle', .12);
      pop(combo > 1 ? 'PERFECT ×' + combo : 'PERFECT', center, GY - PS() * 3.3, C.accent, true);
    } else {
      combo = 0;
      burst(px, GY, C.sub, 6);
      tone(330, .07, 'sine', .07); buzz(8);
      if (edge < S * 0.03) pop('아슬아슬!', px, GY - PS() * 3.3, C.ink, true);
    }
    score += gain;
    pop('+' + gain, player.x, GY - PS() * 2.2, gain > 1 ? C.accent : C.ink, false);
    cur++;
    const l = pillars[pillars.length - 1]; pillars.push(newPillar(l.x + l.w));
    if (cur > 3){ pillars.shift(); cur--; }
    camTarget = pillars[cur].x + pillars[cur].w / 2 - W * 0.28;
    state = 'idle'; player.sq = .6;
    return;
  }

  // 실패
  const near = Math.min(Math.abs(px - n.x), Math.abs(px - (n.x + n.w)));
  if (near < S * 0.04) pop('아깝다!', px, GY - PS() * 3, C.accent, true);
  player.dir = px < n.x ? -1 : 1;
  player.vy = 0; state = 'fall'; fallAt = performance.now();
  shake = 9; buzz([30, 40, 70]);
  tone(150, .35, 'sawtooth', .06);
}
function gameOver(){
  state = 'over'; overAt = performance.now();
  if (score > best){ best = score; newBest = true; save('kkuk_best', best); tone(784, .25, 'triangle', .1); }
}

// ---------- 업데이트 ----------
function update(dt){
  if (state === 'charge') charge = Math.min(charge + dt * S * 0.8, MAXC());
  const target = state === 'charge' ? 1 - (charge / MAXC()) * 0.42 : 1;
  player.sq += (target - player.sq) * Math.min(1, dt * (state === 'charge' ? 30 : 12));

  if (state === 'fly'){
    jump.t += dt;
    const k = Math.min(jump.t / jump.T, 1);
    player.x = jump.x0 + jump.d * k;
    player.y = -4 * jump.h * k * (1 - k);
    player.rot = jump.d > S * 0.05 ? k * Math.PI * 2 : 0;
    if (k >= 1){ player.y = 0; player.rot = 0; land(); }
  }
  if (state === 'fall'){
    player.vy += dt * S * 7;
    player.y += player.vy * dt;
    player.x += player.dir * dt * S * 0.15;
    player.rot += player.dir * dt * 5;
    if (performance.now() - fallAt > 750) gameOver();
  }

  camX += (camTarget - camX) * Math.min(1, dt * 6);
  shake *= Math.pow(0.002, dt);

  for (const p of parts){ p.vy += S * 3 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.6; }
  parts = parts.filter(p => p.life > 0);
  for (const p of pops){ p.y -= S * 0.18 * dt; p.life -= dt * 1.1; }
  pops = pops.filter(p => p.life > 0);
  for (const r of rings){ r.r += S * 0.5 * dt; r.life -= dt * 2.2; }
  rings = rings.filter(r => r.life > 0);
}

// ---------- 그리기 ----------
function rrect(x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function text(t, x, y, size, col, weight = 800, alpha = 1){
  ctx.globalAlpha = alpha; ctx.fillStyle = col;
  ctx.font = weight + ' ' + size + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y); ctx.globalAlpha = 1;
}
function drawPillars(dip){
  pillars.forEach((p, i) => {
    const sx = p.x - camX; if (sx > W + 50 || sx + p.w < -50) return;
    const d = i === cur ? dip : 0;
    ctx.fillStyle = C.ink;
    ctx.fillRect(sx, GY + d, p.w, H - GY + 20);
    if (i > cur || state === 'ready'){
      ctx.fillStyle = C.accent;
      ctx.fillRect(sx + p.w / 2 - PZ() / 2, GY + d, PZ(), Math.max(3, S * 0.008));
    }
  });
}
function drawPlayer(dip){
  const s = PS(), w = s * (1 + (1 - player.sq) * 0.55), h = s * player.sq;
  const sx = player.x - camX, sy = GY + (state === 'charge' || state === 'idle' ? dip : 0) + player.y;
  ctx.save();
  ctx.translate(sx, sy - h / 2);
  ctx.rotate(player.rot);
  ctx.fillStyle = C.accent;
  rrect(-w / 2, -h / 2, w, h, s * 0.2); ctx.fill();
  ctx.restore();
}
function draw(){
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0.3) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

  const dip = state === 'charge' ? (charge / MAXC()) * S * 0.035 : 0;
  const falling = state === 'fall' || state === 'over';
  if (falling){ drawPlayer(dip); drawPillars(dip); } else { drawPillars(dip); drawPlayer(dip); }

  for (const r of rings){
    ctx.globalAlpha = Math.max(r.life, 0); ctx.strokeStyle = C.accent; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(r.x - camX, GY, r.r, r.r * 0.32, 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const p of parts){
    ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.col;
    ctx.fillRect(p.x - camX - p.s / 2, p.y - p.s / 2, p.s, p.s);
  }
  ctx.globalAlpha = 1;
  for (const p of pops) text(p.text, p.x - camX, p.y, p.big ? S * 0.065 : S * 0.05, p.col, 800, Math.min(1, p.life * 1.5));
  ctx.restore();

  // 점수
  if (state !== 'ready' && state !== 'over'){
    text(String(score), W / 2, H * 0.14, Math.min(S * 0.2, 96), C.ink, 800);
    text('최고 ' + best, W / 2, H * 0.14 + Math.min(S * 0.2, 96) * 0.72, 14, C.sub, 600);
    if (combo > 1) text('콤보 ' + combo, W / 2, H * 0.14 + Math.min(S * 0.2, 96) * 1.05, 15, C.accent, 800);
  }

  if (state === 'ready'){
    text('꾹 점프', W / 2, H * 0.2, Math.min(S * 0.15, 56), C.ink, 900);
    text('꾹 눌러서 힘을 모으고, 떼면 점프', W / 2, H * 0.2 + 52, 16, C.sub, 600);
    text('빨간 선 위에 착지하면 PERFECT', W / 2, H * 0.2 + 78, 16, C.accent, 700);
    if (best) text('최고 기록 ' + best, W / 2, H * 0.2 + 112, 14, C.sub, 600);
  }

  if (state === 'over'){
    const t = Math.min((performance.now() - overAt) / 250, 1);
    ctx.globalAlpha = t; ctx.fillStyle = C.veil; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    const cy = H * 0.36;
    text('점수', W / 2, cy - 70, 16, C.sub, 600, t);
    text(String(score), W / 2, cy, Math.min(S * 0.26, 120), C.ink, 900, t);
    if (newBest) text('최고 기록 달성!', W / 2, cy + 72, 18, C.accent, 800, t);
    else text('최고 ' + best + (best - score <= 5 && best > score ? '  ·  ' + (best - score) + '점만 더!' : ''), W / 2, cy + 72, 16, C.sub, 700, t);
    const blink = 0.55 + 0.45 * Math.sin(performance.now() / 260);
    text('탭해서 다시 하기', W / 2, H * 0.72, 18, C.ink, 800, t * blink);
  }
}

// ---------- 반복 ----------
let last = performance.now();
function loop(now){
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
}
</script>
</body>
</html>
